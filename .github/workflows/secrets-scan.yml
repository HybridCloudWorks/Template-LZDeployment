name: Secret Scanning & Security

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    # Run weekly security scan
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  trufflehog-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Fetch all history for comprehensive scan

      # On pull_request, scan only the commit range the PR introduces.
      - name: TruffleHog OSS (PR diff scan)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318  # v3.97.0
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --debug --only-verified

      # On push/schedule/dispatch there is no meaningful base/head pair:
      # run a full-history scan instead.
      - name: TruffleHog OSS (full history scan)
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318  # v3.97.0
        with:
          path: ./
          extra_args: --debug --only-verified

  gitleaks-scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    env:
      # Pin + checksum-verify the CLI release. Deliberately NOT
      # gitleaks/gitleaks-action: since its v3 the ACTION requires a paid
      # license key for organization-owned repos, while the CLI itself is
      # MIT-licensed and free. Same scanner, no license dependency.
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks CLI
        run: |
          set -euo pipefail
          curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLo checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" checksums.txt | awk '{print $1"  gitleaks.tar.gz"}' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz checksums.txt

      - name: Run Gitleaks (full history)
        # .gitleaks.toml at the repo root narrows the built-in rules to
        # allow the documented public test vectors only.
        run: gitleaks git --no-banner --redact --exit-code 1 .

  terraform-security-scan:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    env:
      # Same pinned scanner the post-render validation gate (V08) uses;
      # tfsec is archived upstream and the repo standardized on checkov
      # (TODO item 2.15). This job covers the bare .tf contract files in the
      # template corpus — the DEEP scan runs against fully rendered output
      # in V08 (validate-render / e2e generation proof).
      CHECKOV_VERSION: 3.3.9
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pinned checkov
        run: pip3 install --quiet "checkov==${CHECKOV_VERSION}"

      - name: checkov scan of the template corpus
        run: checkov --directory factory/templates/terraform --quiet

  # Adopted from the corpus security-scan.yml.tmpl (2026-08-02, WP5):
  # Terraform state and saved plans can carry credentials and full resource
  # dumps; they must never be committed.
  terraform-artifact-check:
    name: Committed State/Plan Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check Terraform files for committed plan/state
        shell: bash
        run: |
          bad=$(find . -type f \( -name '*.tfstate' -o -name '*.tfstate.backup' -o -name '*.tfplan' \) -not -path './.git/*' -print)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::Terraform state or plan files must not be committed."
            exit 1
          fi
          echo "No committed .tfstate or .tfplan files."

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [trufflehog-scan, gitleaks-scan, terraform-security-scan]
    if: always()
    steps:
      - name: Security Scan Summary
        run: |
          echo "## 🔐 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| TruffleHog | ${{ needs.trufflehog-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | ${{ needs.gitleaks-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| checkov | ${{ needs.terraform-security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All secret scanning tools completed" >> $GITHUB_STEP_SUMMARY
