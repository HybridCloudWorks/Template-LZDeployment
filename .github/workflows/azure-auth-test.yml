# ─────────────────────────────────────────────────────────────────────────────
# azure-auth-test.yml  – validates OIDC federated identity to Azure
# Run manually once after setting AZURE_CLIENT_ID / TENANT_ID / SUBSCRIPTION_ID
# ─────────────────────────────────────────────────────────────────────────────
name: Azure Auth Test

on:
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  auth-test:
    name: OIDC Login Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          # workflow_dispatch tokens carry a ref:refs/heads/<branch> subject,
          # which is bound to the read-only plan identity only. The apply
          # identity (AZURE_CLIENT_ID) holds environment:<name> subjects
          # exclusively and can only authenticate from environment-gated jobs.
          client-id:       ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify identity
        run: |
          echo "=== Logged-in identity ==="
          az account show --query '{account:id, tenant:tenantId, user:user.name}' -o json

      - name: Show RBAC assignments
        run: |
          echo "=== Role assignments for this SP ==="
          az role assignment list --assignee "$(az account show --query user.name -o tsv)" \
            --query '[].{role:roleDefinitionName, scope:scope}' -o table

      - name: Azure Logout
        if: always()
        run: az logout || true
