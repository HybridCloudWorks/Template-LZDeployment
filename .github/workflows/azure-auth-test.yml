# ─────────────────────────────────────────────────────────────────────────────
# azure-auth-test.yml — verifies OIDC federated identity to Azure AND enforces
# that the plan identity stays read-only (mirrors the corpus template's
# azure-auth-test.yml.tmpl logic; upgraded from informational to enforcing,
# 2026-08-02, WP5).
# ─────────────────────────────────────────────────────────────────────────────
name: Azure Auth Test

on:
  pull_request:
    paths:
      - '.github/workflows/azure-auth-test.yml'
  schedule:
    # Weekly re-verification: catches out-of-band role or federated-credential
    # changes on the plan identity.
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  auth-test:
    name: OIDC Login Test
    # Fork PRs receive no repository secrets; skip rather than fail.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          # Non-environment tokens (ref:refs/heads/<branch> and pull_request
          # subjects) are bound to the read-only plan identity only. The apply
          # identity (AZURE_CLIENT_ID) holds environment:<name> subjects
          # exclusively and can only authenticate from environment-gated jobs.
          client-id:       ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify identity
        run: |
          echo "=== Logged-in identity ==="
          az account show --query '{account:id, tenant:tenantId, user:user.name}' -o json

      - name: Prove the effective identity and refuse write roles
        shell: bash
        run: |
          client_id="${{ secrets.AZURE_PLAN_CLIENT_ID }}"
          roles=$(az role assignment list --assignee "$client_id" --all --query '[].roleDefinitionName' -o tsv)
          echo "=== Role assignments for the plan identity ==="
          echo "$roles"
          if echo "$roles" | grep -Eq '^(Owner|Contributor|User Access Administrator)$'; then
            echo "::error::Plan identity has a write-capable role."
            exit 1
          fi
          echo "$roles" | grep -qx 'Reader' || { echo "::error::Reader role was not found on the plan identity."; exit 1; }
          echo "Plan identity is read-only (Reader present, no write-capable roles)."

      - name: Azure Logout
        if: always()
        run: az logout || true
