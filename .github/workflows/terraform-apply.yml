name: Terraform Apply

# Dispatch-only apply (operator decision, 2026-08-02, WP5): live adopts the
# corpus safety model. There is NO push trigger — merging to main never
# deploys. An operator dispatches this workflow per layer; the run:
#   1. checks out the TRUSTED default branch (never a PR ref),
#   2. validates the requested layer against a hard allowlist,
#   3. creates a saved plan (terraform plan -out=tfplan),
#   4. refuses any plan containing destructive operations,
#   5. applies exactly that reviewed plan through the layer's protected
#      environment gate (dev / prod / hub reviewers).
# Destroys require a separately reviewed break-glass process — never this
# workflow.

on:
  workflow_dispatch:
    inputs:
      layer:
        description: 'Layer to deploy'
        required: true
        type: choice
        options:
          - global
          - platform-connectivity
          - platform-management
          - workloads-prod
          - sandbox
          - all

# Least privilege at the workflow root; each job opts in to what it needs.
permissions: {}

# Serialize applies; never cancel an in-flight deployment.
concurrency:
  group: tf-apply
  cancel-in-progress: false

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  rbac-validation:
    name: RBAC Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          # This gate is read-only and runs without an environment:, so its
          # OIDC token carries the ref:refs/heads/main subject — bound to the
          # plan identity only. The apply identity (AZURE_CLIENT_ID, audited
          # below) holds environment:<name> subjects exclusively; the apply
          # job further down authenticates as it under its environment.
          client-id: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Service Principal RBAC (Finding 1.1 - CVSS 9.1)
        run: |
          echo "Validating deployment service principal RBAC..."

          ROLE_ASSIGNMENTS=$(az role assignment list \
            --assignee ${{ secrets.AZURE_CLIENT_ID }} \
            --all \
            --query "[].{Role:roleDefinitionName, Scope:scope}" \
            --output json)

          OWNER_COUNT=$(echo "$ROLE_ASSIGNMENTS" | jq '[.[] | select(.Role == "Owner")] | length')
          UAA_COUNT=$(echo "$ROLE_ASSIGNMENTS" | jq '[.[] | select(.Role == "User Access Administrator")] | length')

          if [ "$OWNER_COUNT" -gt 0 ]; then
            echo "::error::CRITICAL: Service Principal has Owner role (CVSS 9.1). Deployment blocked; remove Owner first."
            exit 1
          fi

          if [ "$UAA_COUNT" -gt 0 ]; then
            echo "::error::CRITICAL: Service Principal has User Access Administrator role — an Owner-equivalent escalation path. Replace with Role Based Access Control Administrator constrained by delegation conditions."
            exit 1
          fi

          echo "RBAC validation passed"

  compute-matrix:
    name: Compute Deploy Matrix
    runs-on: ubuntu-latest
    needs: rbac-validation
    timeout-minutes: 5
    outputs:
      layers: ${{ steps.matrix.outputs.layers }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Reject unknown layer
        env:
          REQUESTED_LAYER: ${{ inputs.layer }}
          ALLOWED_LAYERS: 'global,platform-connectivity,platform-management,workloads-prod,sandbox,all'
        run: |
          # Defense in depth: the choice input constrains the UI, this guard
          # constrains API-dispatched runs too.
          case ",$ALLOWED_LAYERS," in
            *",$REQUESTED_LAYER,"*) ;;
            *) echo "::error::Unknown or unrendered layer: $REQUESTED_LAYER"; exit 1 ;;
          esac

      - name: Compute matrix layers
        id: matrix
        env:
          REQUESTED_LAYER: ${{ inputs.layer }}
        run: |
          if [ "$REQUESTED_LAYER" = "all" ]; then
            LAYERS='["global","platform-connectivity","platform-management","workloads-prod","sandbox"]'
          else
            LAYERS=$(printf '%s' "$REQUESTED_LAYER" | jq -R . | jq -s -c .)
          fi
          echo "layers=$LAYERS" >> $GITHUB_OUTPUT

          # Map each layer to the GitHub environment created by the bootstrap
          # script (dev / prod / hub):
          #   global, platform-connectivity, platform-management -> hub
          #   workloads-prod                                     -> prod
          #   sandbox                                            -> dev
          MATRIX=$(echo "$LAYERS" | jq -c '{include: [ .[] | {layer: ., environment: (if . == "sandbox" then "dev" elif . == "workloads-prod" then "prod" else "hub" end)} ]}')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Deploy matrix: $MATRIX"

  terraform-apply:
    name: Apply ${{ matrix.layer }}
    runs-on: ubuntu-latest
    needs: [rbac-validation, compute-matrix]
    if: needs.compute-matrix.outputs.layers != '[]' && needs.compute-matrix.outputs.layers != ''
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix: ${{ fromJson(needs.compute-matrix.outputs.matrix) }}
      max-parallel: 1  # Sequential deployment to respect dependencies

    environment:
      name: ${{ matrix.environment }}
      url: https://portal.azure.com

    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Always apply what main says, regardless of the ref the dispatch
          # was made from.
          ref: main

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.9.8
          # Without this, the wrapper echoes a "[command]..." line ahead of
          # stdout, corrupting the plan.json / outputs.json redirects below.
          terraform_wrapper: false

      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: terraform/live/${{ matrix.layer }}
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Validate
        working-directory: terraform/live/${{ matrix.layer }}
        run: terraform validate

      - name: Create reviewed plan
        working-directory: terraform/live/${{ matrix.layer }}
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Refuse destructive apply
        working-directory: terraform/live/${{ matrix.layer }}
        run: |
          terraform show -json tfplan > plan.json
          destroys=$(jq '[.resource_changes[]? | select(.change.actions[]? == "delete")] | length' plan.json)
          echo "Resources scheduled for destruction: $destroys"
          if [ "$destroys" -gt 0 ]; then
            echo "::error::Apply contains $destroys destructive operation(s). Use a separately reviewed break-glass process."
            exit 1
          fi

      - name: Apply reviewed plan
        working-directory: terraform/live/${{ matrix.layer }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform Output
        working-directory: terraform/live/${{ matrix.layer }}
        id: outputs
        run: |
          # Written to a file and uploaded as an artifact only — never echoed
          # into the job log (outputs can contain sensitive values).
          terraform output -json > outputs.json

      # Consumed by the OPERATOR only (the documented log_analytics_workspace_id
      # loop-back after platform-management applies) — no workflow downloads it.
      # Outputs can contain sensitive values: minimum retention, download it
      # promptly, and treat the downloaded file as confidential.
      - name: Upload Outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: outputs-${{ matrix.layer }}
          path: terraform/live/${{ matrix.layer }}/outputs.json
          retention-days: 1
