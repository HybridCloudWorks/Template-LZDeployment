name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      layer:
        description: 'Layer to deploy'
        required: true
        type: choice
        options:
          - global
          - platform-connectivity
          - platform-management
          - workloads-prod
          - sandbox
          - all

permissions:
  id-token: write
  contents: read

# Serialize applies; never cancel an in-flight deployment.
concurrency:
  group: tf-apply
  cancel-in-progress: false

env:
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  rbac-validation:
    name: RBAC Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          # This gate is read-only and runs without an environment:, so its
          # OIDC token carries the ref:refs/heads/main subject — bound to the
          # plan identity only. The apply identity (AZURE_CLIENT_ID, audited
          # below) holds environment:<name> subjects exclusively; the apply
          # jobs further down authenticate as it under their environment.
          client-id: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Service Principal RBAC (Finding 1.1 - CVSS 9.1)
        run: |
          echo "🔐 Validating deployment service principal RBAC..."

          ROLE_ASSIGNMENTS=$(az role assignment list \
            --assignee ${{ secrets.AZURE_CLIENT_ID }} \
            --all \
            --query "[].{Role:roleDefinitionName, Scope:scope}" \
            --output json)

          OWNER_COUNT=$(echo "$ROLE_ASSIGNMENTS" | jq '[.[] | select(.Role == "Owner")] | length')
          UAA_COUNT=$(echo "$ROLE_ASSIGNMENTS" | jq '[.[] | select(.Role == "User Access Administrator")] | length')

          if [ "$OWNER_COUNT" -gt 0 ]; then
            echo "❌ CRITICAL: Service Principal has Owner role (CVSS 9.1)"
            echo "Deployment blocked for security. Remove Owner role first."
            exit 1
          fi

          if [ "$UAA_COUNT" -gt 0 ]; then
            echo "❌ CRITICAL: Service Principal has User Access Administrator role"
            echo "This grants an Owner-equivalent RBAC escalation path."
            echo "Deployment blocked. Replace with Role Based Access Control Administrator constrained by delegation conditions."
            exit 1
          fi

          echo "✅ RBAC validation passed"

  detect-changes:
    name: Detect Changed Layers
    runs-on: ubuntu-latest
    needs: rbac-validation
    if: github.event_name != 'workflow_dispatch'
    timeout-minutes: 10
    outputs:
      layers: ${{ steps.detect.outputs.layers }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed layers
        id: detect
        run: |
          # Diff the exact commit range delivered by this push event, not HEAD^,
          # so multi-commit pushes and merge commits are covered.
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            # Branch creation or unreachable before-SHA (e.g. force push): fall back
            BEFORE=$(git rev-parse "$AFTER^")
          fi

          CHANGED_FILES=$(git diff --name-only "$BEFORE" "$AFTER" | grep '^terraform/live/' || true)

          LAYERS=()
          if echo "$CHANGED_FILES" | grep -q 'terraform/live/global/'; then
            LAYERS+=("global")
          fi
          if echo "$CHANGED_FILES" | grep -q 'terraform/live/platform-connectivity/'; then
            LAYERS+=("platform-connectivity")
          fi
          if echo "$CHANGED_FILES" | grep -q 'terraform/live/platform-management/'; then
            LAYERS+=("platform-management")
          fi
          if echo "$CHANGED_FILES" | grep -q 'terraform/live/workloads-prod/'; then
            LAYERS+=("workloads-prod")
          fi
          if echo "$CHANGED_FILES" | grep -q 'terraform/live/sandbox/'; then
            LAYERS+=("sandbox")
          fi

          # Convert array to JSON; an empty array must emit [] (not [""])
          if [ ${#LAYERS[@]} -eq 0 ]; then
            LAYERS_JSON='[]'
          else
            LAYERS_JSON=$(printf '%s\n' "${LAYERS[@]}" | jq -R . | jq -s -c .)
          fi
          echo "layers=$LAYERS_JSON" >> $GITHUB_OUTPUT
          echo "Changed layers: $LAYERS_JSON"

  compute-matrix:
    name: Compute Deploy Matrix
    runs-on: ubuntu-latest
    needs: [rbac-validation, detect-changes]
    if: always() && needs.rbac-validation.result == 'success'
    timeout-minutes: 5
    outputs:
      layers: ${{ steps.matrix.outputs.layers }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Compute matrix layers
        id: matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.layer }}" = "all" ]; then
              LAYERS='["global","platform-connectivity","platform-management","workloads-prod","sandbox"]'
            else
              LAYERS='["${{ github.event.inputs.layer }}"]'
            fi
          else
            LAYERS='${{ needs.detect-changes.outputs.layers }}'
          fi

          if [ -z "$LAYERS" ]; then
            LAYERS='[]'
          fi
          echo "layers=$LAYERS" >> $GITHUB_OUTPUT

          # Map each layer to the GitHub environment created by the bootstrap
          # script (dev / prod / hub):
          #   global, platform-connectivity, platform-management -> hub
          #   workloads-prod                                     -> prod
          #   sandbox                                            -> dev
          MATRIX=$(echo "$LAYERS" | jq -c '{include: [ .[] | {layer: ., environment: (if . == "sandbox" then "dev" elif . == "workloads-prod" then "prod" else "hub" end)} ]}')
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Deploy matrix: $MATRIX"

  terraform-apply:
    name: Apply ${{ matrix.layer }}
    runs-on: ubuntu-latest
    needs: [rbac-validation, compute-matrix]
    if: always() && needs.rbac-validation.result == 'success' && needs.compute-matrix.outputs.layers != '[]' && needs.compute-matrix.outputs.layers != ''
    timeout-minutes: 60
    strategy:
      matrix: ${{ fromJson(needs.compute-matrix.outputs.matrix) }}
      max-parallel: 1  # Sequential deployment to respect dependencies

    environment:
      name: ${{ matrix.environment }}
      url: https://portal.azure.com

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.9.0

      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: terraform/live/${{ matrix.layer }}
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Validate
        working-directory: terraform/live/${{ matrix.layer }}
        run: terraform validate

      - name: Terraform Apply
        working-directory: terraform/live/${{ matrix.layer }}
        run: terraform apply -input=false -auto-approve

      - name: Terraform Output
        working-directory: terraform/live/${{ matrix.layer }}
        id: outputs
        run: |
          # Written to a file and uploaded as an artifact only — never echoed
          # into the job log (outputs can contain sensitive values).
          terraform output -json > outputs.json

      - name: Upload Outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: outputs-${{ matrix.layer }}
          path: terraform/live/${{ matrix.layer }}/outputs.json
          retention-days: 5
