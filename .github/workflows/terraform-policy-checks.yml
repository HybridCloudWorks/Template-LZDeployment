name: Terraform Policy Checks

# The repository carries no working Terraform tree (generator-only model,
# ADR 0013). This workflow is the execution-time verification of the emitted
# corpus: it renders both topology fixtures and runs fmt/init/validate on the
# RENDERED output. `terraform init` here is what re-verifies every AVM module
# pin and provider constraint against the live Terraform Registry — the gate
# the pins document requires before delivery.

on:
  pull_request:
    branches: [main]
    paths:
      - "factory/**"
      - ".github/workflows/terraform-policy-checks.yml"
  push:
    branches: [main]
    paths:
      - "factory/**"
      - ".github/workflows/terraform-policy-checks.yml"

permissions:
  contents: read

jobs:
  render-validate:
    name: render + fmt + init + validate (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture: [azurerm-config, vwan-config]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.9.8

      - name: Render fixture
        shell: pwsh
        run: |
          Import-Module ./factory/renderer/LZFactory.Renderer.psd1
          Invoke-LzRender -ConfigPath "factory/tests/fixtures/${{ matrix.fixture }}.json" `
                          -OutputDirectory rendered-fixture -Quiet | Out-Null

      - name: Terraform fmt (rendered output, fail-fast)
        run: terraform fmt -check -recursive rendered-fixture

      - name: Terraform init + validate (verifies AVM pins against the registry)
        shell: bash
        run: |
          set -euo pipefail
          for d in rendered-fixture/terraform/live/*; do
            [ -d "$d" ] || continue
            echo "Validating layer: $d"
            terraform -chdir="$d" init -backend=false -input=false -no-color >/dev/null
            terraform -chdir="$d" validate -no-color
          done

      - name: Zero residual placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -rn '__[A-Z0-9_]\+__' rendered-fixture; then
            echo "::error::Unfilled placeholder tokens survived rendering."
            exit 1
          fi
          if grep -rnP '(?<!\$)\{\{[^}]*\}\}' rendered-fixture; then
            echo "::error::Unresolved factory tokens survived rendering."
            exit 1
          fi
          echo "No residual placeholders."
