name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-*.yml'

permissions:
  id-token: write
  contents: read
  pull-requests: write

# One plan run per ref; superseded pushes cancel the in-flight plan.
concurrency:
  group: tf-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  ARM_USE_OIDC: true
  # This workflow only runs on pull_request, and the pull_request OIDC subject
  # is bound exclusively to the Reader-only plan SP (AZURE_PLAN_CLIENT_ID).
  # The Contributor SP (AZURE_CLIENT_ID) holds no pull_request credential.
  ARM_CLIENT_ID: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

# NOTE: pull_request runs from forks do not receive repository secrets.
# Every azure/login-dependent step below carries a same-repo guard, and a
# notice step reports the skipped cloud plan explicitly for fork PRs.

jobs:
  rbac-validation:
    name: RBAC Security Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fork PR notice (credential-free validation)
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::notice::PR originates from a fork. Repository secrets are unavailable, so Azure OIDC login, the RBAC audit, and the cloud terraform plan are skipped. Format and static validation still run."
          {
            echo "## Fork PR — credential-free validation"
            echo ""
            echo "This pull request comes from a fork. GitHub does not expose repository"
            echo "secrets to fork-triggered \`pull_request\` runs, so the Azure OIDC login,"
            echo "RBAC validation, and cloud \`terraform plan\` were **skipped**."
            echo "Format checks and static validation still run below."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure Login (OIDC)
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Service Principal RBAC (Finding 1.1 - CVSS 9.1)
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          echo "## 🔐 Service Principal RBAC Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Get current SP role assignments
          ROLE_ASSIGNMENTS=$(az role assignment list \
            --assignee ${{ secrets.AZURE_CLIENT_ID }} \
            --all \
            --query "[].{Role:roleDefinitionName, Scope:scope}" \
            --output json)

          echo "### Current Role Assignments:" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo "$ROLE_ASSIGNMENTS" | jq '.' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check for privilege-escalation-capable roles (CRITICAL SECURITY VIOLATION)
          OWNER_COUNT=$(echo "$ROLE_ASSIGNMENTS" | jq '[.[] | select(.Role == "Owner")] | length')
          UAA_COUNT=$(echo "$ROLE_ASSIGNMENTS" | jq '[.[] | select(.Role == "User Access Administrator")] | length')

          if [ "$OWNER_COUNT" -gt 0 ]; then
            echo "❌ **CRITICAL SECURITY VIOLATION**: Service Principal has Owner role" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Risk**: CVSS 9.1 - Can escalate privileges and modify RBAC" >> $GITHUB_STEP_SUMMARY
            echo "**Required Action**: Remove Owner, assign Contributor only" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '**Remediation**:' >> $GITHUB_STEP_SUMMARY
            echo '```bash' >> $GITHUB_STEP_SUMMARY
            echo "az role assignment delete --assignee ${{ secrets.AZURE_CLIENT_ID }} --role Owner" >> $GITHUB_STEP_SUMMARY
            echo "az role assignment create --assignee ${{ secrets.AZURE_CLIENT_ID }} --role Contributor --scope /subscriptions/\$SUBSCRIPTION_ID" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **PASS**: No Owner role assignments" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$UAA_COUNT" -gt 0 ]; then
            echo "❌ **CRITICAL SECURITY VIOLATION**: Service Principal has User Access Administrator role" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Risk**: Can rewrite RBAC assignments — equivalent escalation path to Owner" >> $GITHUB_STEP_SUMMARY
            echo "**Required Action**: Remove User Access Administrator; if role delegation is needed, use Role Based Access Control Administrator constrained with delegation conditions" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **PASS**: No User Access Administrator role assignments" >> $GITHUB_STEP_SUMMARY
          fi

          # Flag Contributor on the plan identity — PR plans should run read-only.
          # The plan SP (AZURE_PLAN_CLIENT_ID) is the identity this workflow
          # authenticates as; the Contributor SP audited above never runs on PRs.
          PLAN_ROLE_ASSIGNMENTS=$(az role assignment list \
            --assignee ${{ secrets.AZURE_PLAN_CLIENT_ID }} \
            --all \
            --query "[].{Role:roleDefinitionName, Scope:scope}" \
            --output json)
          CONTRIBUTOR_COUNT=$(echo "$PLAN_ROLE_ASSIGNMENTS" | jq '[.[] | select(.Role == "Contributor")] | length')

          if [ "$CONTRIBUTOR_COUNT" -gt 0 ]; then
            echo "⚠️  **FLAG**: Plan identity holds Contributor role — PR-triggered plans should use a Reader-only service principal" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **PASS**: Plan identity holds no Contributor role (read-only)" >> $GITHUB_STEP_SUMMARY
          fi

  detect-changes:
    name: Detect Changed Layers
    runs-on: ubuntu-latest
    needs: rbac-validation
    timeout-minutes: 10
    outputs:
      layers: ${{ steps.detect.outputs.layers }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed layers
        id: detect
        run: |
          # Detect which Terraform layers changed
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD | grep '^terraform/live/' || true)

          LAYERS=()
          if echo "$CHANGED_FILES" | grep -q 'terraform/live/global/'; then
            LAYERS+=("global")
          fi
          if echo "$CHANGED_FILES" | grep -q 'terraform/live/platform-connectivity/'; then
            LAYERS+=("platform-connectivity")
          fi
          if echo "$CHANGED_FILES" | grep -q 'terraform/live/platform-management/'; then
            LAYERS+=("platform-management")
          fi
          if echo "$CHANGED_FILES" | grep -q 'terraform/live/workloads-prod/'; then
            LAYERS+=("workloads-prod")
          fi
          if echo "$CHANGED_FILES" | grep -q 'terraform/live/sandbox/'; then
            LAYERS+=("sandbox")
          fi

          # Convert array to JSON; an empty array must emit [] (not [""])
          if [ ${#LAYERS[@]} -eq 0 ]; then
            LAYERS_JSON='[]'
          else
            LAYERS_JSON=$(printf '%s\n' "${LAYERS[@]}" | jq -R . | jq -s -c .)
          fi
          echo "layers=$LAYERS_JSON" >> $GITHUB_OUTPUT
          echo "Changed layers: $LAYERS_JSON"

  terraform-plan:
    name: Plan ${{ matrix.layer }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.layers != '[]'
    timeout-minutes: 30
    strategy:
      matrix:
        layer: ${{ fromJson(needs.detect-changes.outputs.layers) }}
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.9.0

      - name: Fork PR notice (cloud plan skipped)
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::notice::Fork PR for layer ${{ matrix.layer }}: no repository secrets available — Azure login, init, validate, and cloud plan are skipped. Only the format check runs."
          echo "### Plan \`${{ matrix.layer }}\`: cloud plan **skipped** (fork PR, credential-free run)" >> "$GITHUB_STEP_SUMMARY"

      - name: Azure Login (OIDC)
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43  # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Format Check
        id: fmt
        working-directory: terraform/live/${{ matrix.layer }}
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        if: github.event.pull_request.head.repo.full_name == github.repository
        working-directory: terraform/live/${{ matrix.layer }}
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Validate
        id: validate
        if: github.event.pull_request.head.repo.full_name == github.repository
        working-directory: terraform/live/${{ matrix.layer }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        if: github.event.pull_request.head.repo.full_name == github.repository
        working-directory: terraform/live/${{ matrix.layer }}
        run: |
          # -lock=false: the Reader-only plan SP has data-plane read on state
          # but no write, so it cannot create the lock blob. PR plans are
          # advisory; the apply path still locks.
          terraform plan -input=false -no-color -lock=false -out=tfplan
          terraform show -no-color tfplan > plan.txt
        continue-on-error: true

      - name: Upload Plan Artifact
        if: github.event.pull_request.head.repo.full_name == github.repository && steps.plan.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tfplan-${{ matrix.layer }}
          path: terraform/live/${{ matrix.layer }}/tfplan
          retention-days: 5

      - name: Comment PR with Plan
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const planPath = 'terraform/live/${{ matrix.layer }}/plan.txt';
            const plan = fs.existsSync(planPath)
              ? fs.readFileSync(planPath, 'utf8')
              : '(no plan output produced — see the Terraform Plan step log)';
            const truncatedPlan = plan.length > 65000 ? plan.substring(0, 65000) + '\n\n... (truncated)' : plan;

            const output = `### Terraform Plan: \`${{ matrix.layer }}\`

            #### Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Plan 📖\`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${truncatedPlan}
            \`\`\`

            </details>

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Workflow: \`${{ github.workflow }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # Terminal gate: fmt and plan run with continue-on-error so the PR comment
      # above always posts first, but their failures must still fail the job.
      - name: Fail job on fmt/plan failure
        if: steps.plan.outcome == 'failure' || steps.fmt.outcome == 'failure'
        run: |
          echo "::error::Terraform fmt (${{ steps.fmt.outcome }}) or plan (${{ steps.plan.outcome }}) failed for layer ${{ matrix.layer }}"
          exit 1
