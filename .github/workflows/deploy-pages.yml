name: Deploy Wizard to GitHub Pages

# Hosts both static pages on GitHub Pages:
#   - site/     -> published at the artifact ROOT (existing wizard URLs stay
#                  stable: /index.html etc.)
#   - frontend/ -> published under /frontend/ (legacy .tfvars generator,
#                  zero-network since PR #60)
# Both trees are enforced network-free by factory/ci/Test-SiteNoNetwork.ps1,
# so Pages hosting adds no data-egress surface.
#
# Local-preview nuance: frontend/'s "../index.html" links match THIS published
# layout; when serving the raw repo root over localhost, "../index.html" is the
# repo root (not site/) — use the published layout or serve a staged _pages/.
#
# PAGES ENABLEMENT — read this before debugging a red run here.
#
# The repository must have a Pages site with build type "GitHub Actions".
# Runs #1–#13 (2026-08-01 → 2026-08-19) all failed because it did not exist.
#
# `configure-pages` below sets `enablement: true` so it will try to create
# the site — but note the hard constraint: the Actions `GITHUB_TOKEN`
# **cannot** create a Pages site. That needs `administration:write`, which
# the job token is structurally incapable of holding; it is a deliberate
# GitHub security restriction (actions/configure-pages#40), not something a
# `permissions:` block can grant. Run #13 proved it here — the create call
# returned "Resource not accessible by integration" with `pages: write`
# granted on this job.
#
# So enablement works only when the repo secret `PAGES_PAT` is set (a
# fine-grained PAT with Pages: Read and write). Without it the token falls
# back to `github.token`, which is fine for every run AFTER the site
# exists. The "Explain Pages enablement failure" step below prints the two
# one-time fix routes into the job summary rather than leaving a cryptic
# HttpError.
#
# Preferred route remains enabling Pages by hand once (Settings → Pages →
# Source → GitHub Actions): it introduces no long-lived credential, which
# this repository otherwise avoids.
#
# Permissions note: the BUILD job carries `pages: write` in addition to
# `contents: read`, which reverses this workflow's earlier posture that
# enablement was deliberately not automated to keep the build token
# minimal. It is retained (operator-directed 2026-08-19) so the PAT route
# works and so the site config is refreshed on every run. It does not grant
# deployment — that still requires the `id-token: write` OIDC exchange
# scoped to the deploy job below. See TODO.md item 4.3 / REVIEW.md §8.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Only one Pages deployment at a time; do not cancel an in-flight production
# deployment in favor of a newer one.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `pages: write` is required by configure-pages' `enablement: true` (it
    # creates the Pages site via the Pages API). `contents: read` must be
    # restated: a job-level permissions block replaces the workflow-level
    # one rather than extending it, and the checkout below needs it.
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Stage pages layout (site at root, frontend under /frontend/)
        run: |
          mkdir -p _pages/frontend
          cp -r site/. _pages/
          cp -r frontend/. _pages/frontend/
          echo "Staged layout:"
          find _pages -maxdepth 2 -type f | sort

      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        with:
          # Create the Pages site and set build type "GitHub Actions" if it
          # does not already exist. Idempotent: a no-op once the site exists.
          enablement: true
          # The Actions GITHUB_TOKEN CANNOT create a Pages site: site
          # creation needs administration:write, which that token is
          # structurally incapable of holding (actions/configure-pages#40 --
          # a deliberate security fix, not a permissions misconfiguration).
          # So enablement only actually works when PAGES_PAT is set. When it
          # is absent this falls back to the job token, which is sufficient
          # for every run AFTER the site exists; the guidance step below
          # explains the failure when it does not.
          token: ${{ secrets.PAGES_PAT || github.token }}

      - name: Explain Pages enablement failure
        if: failure() && steps.configure.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages is not enabled::See the summary for how to fix this."
          {
            echo "## GitHub Pages is not enabled for this repository"
            echo
            echo "\`configure-pages\` could not find an existing Pages site and could not create one."
            echo
            echo "**Why creating it failed:** the Actions \`GITHUB_TOKEN\` cannot create a Pages site."
            echo "Site creation requires \`administration:write\`, which that token is structurally"
            echo "incapable of holding. This is a deliberate GitHub security restriction"
            echo "(actions/configure-pages#40), not a misconfiguration in this repository, and no"
            echo "\`permissions:\` block can grant it."
            echo
            echo "### Fix it with either route (both are one-time)"
            echo
            echo "1. **Enable Pages by hand (recommended).** Repository **Settings -> Pages ->"
            echo "   Source -> GitHub Actions**. No credential to create or store. Every later run"
            echo "   works with the job token, and \`enablement: true\` becomes a harmless no-op."
            echo
            echo "   Equivalent API call, run by a repo admin:"
            echo
            echo "   \`\`\`"
            echo "   gh api -X POST repos/${{ github.repository }}/pages -f build_type=workflow"
            echo "   \`\`\`"
            echo
            echo "2. **Let this workflow do it.** Add a repository secret \`PAGES_PAT\` holding a"
            echo "   fine-grained PAT scoped to this repository with the **Pages: Read and write**"
            echo "   permission, then re-run. Note this introduces a long-lived credential, which"
            echo "   this repository otherwise avoids -- prefer route 1 unless you need the"
            echo "   enablement itself automated."
            echo
            echo "Backlog: TODO.md item 4.3 / REVIEW.md section 8."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _pages/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pages OIDC deployment needs exactly these two scopes, on this job only.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
