name: Dogfood Instance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Render, plan, or protected apply
        required: true
        default: Render
        type: choice
        options: [Render, Plan, Apply]
      layer:
        description: Rendered layer or all
        required: true
        default: all
        type: choice
        options:
          - all
          - global
          - platform-connectivity
          - platform-management
          - workloads-prod
          - workloads-nonprod
          - sandbox
      environment:
        description: Protected environment used only for Apply
        required: true
        default: prod
        type: environment

permissions: {}

concurrency:
  group: dogfood-${{ inputs.mode }}-${{ inputs.layer }}
  cancel-in-progress: false

jobs:
  render:
    if: inputs.mode == 'Render'
    name: Dogfood Render
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      LZ_DOGFOOD_MODE: Render
      LZ_DOGFOOD_LAYER: ${{ inputs.layer }}
      LZ_DOGFOOD_REPOSITORY: ${{ github.repository }}
      LZ_DOGFOOD_OUTPUT: dogfood-output
      LZ_DOGFOOD_EVIDENCE: dogfood-evidence
      LZ_DOGFOOD_CONFIG_PATH: dogfood-config.json
      LZ_DOGFOOD_CONFIG_JSON: ${{ vars.LZ_DOGFOOD_CONFIG_JSON }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Materialize runtime configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LZ_DOGFOOD_CONFIG_JSON)) {
            throw 'Repository variable LZ_DOGFOOD_CONFIG_JSON is required.'
          }
          [IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE $env:LZ_DOGFOOD_CONFIG_PATH),
            $env:LZ_DOGFOOD_CONFIG_JSON,
            [Text.UTF8Encoding]::new($false)
          )
      - name: Run dogfood render
        shell: pwsh
        run: ./dogfood-instance.ps1 -Mode Render -Layer '${{ inputs.layer }}'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogfood-${{ github.run_id }}-render-${{ inputs.layer }}
          path: dogfood-evidence/
          if-no-files-found: error
          retention-days: 30

  plan:
    if: inputs.mode == 'Plan'
    name: Dogfood Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      LZ_DOGFOOD_MODE: Plan
      LZ_DOGFOOD_LAYER: ${{ inputs.layer }}
      LZ_DOGFOOD_REPOSITORY: ${{ github.repository }}
      LZ_DOGFOOD_OUTPUT: dogfood-output
      LZ_DOGFOOD_EVIDENCE: dogfood-evidence
      LZ_DOGFOOD_CONFIG_PATH: dogfood-config.json
      LZ_DOGFOOD_CONFIG_JSON: ${{ vars.LZ_DOGFOOD_CONFIG_JSON }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Materialize runtime configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LZ_DOGFOOD_CONFIG_JSON)) {
            throw 'Repository variable LZ_DOGFOOD_CONFIG_JSON is required.'
          }
          [IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE $env:LZ_DOGFOOD_CONFIG_PATH),
            $env:LZ_DOGFOOD_CONFIG_JSON,
            [Text.UTF8Encoding]::new($false)
          )
      - name: Azure login with read-only plan identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.LZ_DOGFOOD_PLAN_CLIENT_ID }}
          tenant-id: ${{ vars.LZ_DOGFOOD_TENANT_ID }}
          subscription-id: ${{ vars.LZ_DOGFOOD_SUBSCRIPTION_ID }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ vars.LZ_DOGFOOD_TERRAFORM_VERSION || '1.9.8' }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: Run dogfood plan
        shell: pwsh
        run: ./dogfood-instance.ps1 -Mode Plan -Layer '${{ inputs.layer }}'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogfood-${{ github.run_id }}-plan-${{ inputs.layer }}
          path: dogfood-evidence/
          if-no-files-found: error
          retention-days: 30

  apply:
    if: inputs.mode == 'Apply'
    name: Dogfood Apply
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      LZ_DOGFOOD_MODE: Apply
      LZ_DOGFOOD_APPLY: 'true'
      LZ_DOGFOOD_LAYER: ${{ inputs.layer }}
      LZ_DOGFOOD_REPOSITORY: ${{ github.repository }}
      LZ_DOGFOOD_OUTPUT: dogfood-output
      LZ_DOGFOOD_EVIDENCE: dogfood-evidence
      LZ_DOGFOOD_CONFIG_PATH: dogfood-config.json
      LZ_DOGFOOD_CONFIG_JSON: ${{ vars.LZ_DOGFOOD_CONFIG_JSON }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Materialize runtime configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LZ_DOGFOOD_CONFIG_JSON)) {
            throw 'Repository variable LZ_DOGFOOD_CONFIG_JSON is required.'
          }
          [IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE $env:LZ_DOGFOOD_CONFIG_PATH),
            $env:LZ_DOGFOOD_CONFIG_JSON,
            [Text.UTF8Encoding]::new($false)
          )
      - name: Azure login with protected apply identity
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ vars.LZ_DOGFOOD_TENANT_ID }}
          subscription-id: ${{ vars.LZ_DOGFOOD_SUBSCRIPTION_ID }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ vars.LZ_DOGFOOD_TERRAFORM_VERSION || '1.9.8' }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: Run protected dogfood apply
        shell: pwsh
        run: ./dogfood-instance.ps1 -Mode Apply -Layer '${{ inputs.layer }}' -AllowApply
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dogfood-${{ github.run_id }}-apply-${{ inputs.layer }}
          path: dogfood-evidence/
          if-no-files-found: error
          retention-days: 90
