name: Action Pinning Policy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'factory/templates/.github/workflows/**'
      - 'factory/ci/Test-ActionPins.ps1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'factory/templates/.github/workflows/**'
      - 'factory/ci/Test-ActionPins.ps1'

permissions:
  contents: read

jobs:
  enforce-pinning:
    name: Enforce Immutable Action Refs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Fail on non-SHA action refs
        shell: pwsh
        run: |
          # Strict policy: every `uses:` ref (except local ./ and docker:// refs)
          # must be pinned to a full 40-hex commit SHA. Shares the exact rule the
          # factory CI enforces (factory/ci/Test-ActionPins.ps1) and avoids bash
          # globstar entirely.
          ./factory/ci/Test-ActionPins.ps1
