version: 2
updates:
  # GitHub Actions dependency updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
    open-pull-requests-limit: 10
    reviewers:
      - "saulpatinojr"
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group all GitHub Actions updates in a single PR
    groups:
      github-actions:
        patterns:
          - "*"

  # No terraform entry: this repository carries no working Terraform tree
  # (generator-only model, ADR 0013). The AVM module and provider pins live in
  # factory/templates/**/*.tf.tmpl, which dependabot cannot parse; they are
  # bumped by hand alongside factory-version.json's avm block, and every
  # GENERATED repository receives its own renovate.json so pins update there
  # forever without the factory.
